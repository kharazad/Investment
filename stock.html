```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 주식 거래 일지 (클라우드 동기화)</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useMemo, useEffect } = React;

    // --- Firebase 초기화 및 안전장치 ---
    let envFirebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined') {
        envFirebaseConfig = JSON.parse(__firebase_config);
      }
    } catch(e) {}

    // 🔥 외부(GitHub 등) 배포용 Firebase 설정 🔥
    const myFirebaseConfig = {
      apiKey: "AIzaSyAJ9wGycYaeftpSMxb4jbqSmS8XiNRSxmE",
      authDomain: "lyh-investment.firebaseapp.com",
      projectId: "lyh-investment",
      storageBucket: "lyh-investment.firebasestorage.app",
      messagingSenderId: "834678087007",
      appId: "1:834678087007:web:f980c1d89fb893ae57aaea",
      measurementId: "G-TXYE8H374B"
    };

    const finalConfig = envFirebaseConfig || myFirebaseConfig;

    let app, auth, db;
    let isCloudReady = false;

    // 설정값이 유효할 때만 클라우드 DB 연결을 시도하여 크래시 방지
    if (finalConfig && finalConfig.apiKey) {
      app = initializeApp(finalConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      isCloudReady = true;
    }

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'github-stock-tracker-app';

    // 아이콘 SVG 컴포넌트들
    const ActivityIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>);
    const DollarSignIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>);
    const PlusIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>);
    const Edit2Icon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>);
    const Trash2Icon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>);
    const TrendingUpIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>);
    const SettingsIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>);

    const StockTracker = () => {
      // ---------------- 상태 관리 ----------------
      const [user, setUser] = useState(null);
      const [authResolved, setAuthResolved] = useState(false);
      const [stocks, setStocks] = useState(['스페이스X', '애플', '테슬라', '엔비디아', '마이크로소프트', '삼성전자']);
      const [trades, setTrades] = useState([]);
      const [isStockModalOpen, setIsStockModalOpen] = useState(false);
      const [newStockName, setNewStockName] = useState('');
      
      const [isEditing, setIsEditing] = useState(false);
      const [currentId, setCurrentId] = useState(null);

      const [alertMsg, setAlertMsg] = useState('');
      const [confirmAction, setConfirmAction] = useState(null);

      const [formData, setFormData] = useState({
        marketType: 'international', // 'international' 또는 'domestic'
        stockName: '',
        date: new Date().toISOString().split('T')[0],
        buyQty: '', buyPrice: '', sellQty: '', sellPrice: '', exchangeRate: '',
      });
      const [isFetchingRate, setIsFetchingRate] = useState(false);

      // ---------------- 1. Firebase 로그인 초기화 ----------------
      useEffect(() => {
        if (!isCloudReady) return; 
        
        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthResolved(true);
        });
        return () => unsubscribe();
      }, []);

      // ---------------- 2. Firebase 데이터 실시간 구독 (공유 경로로 변경) ----------------
      useEffect(() => {
        if (!user || !isCloudReady) return;

        // PC와 폰의 임시 ID가 달라도 데이터를 공유할 수 있도록 'public' 경로에 저장
        const tradesRef = collection(db, 'artifacts', appId, 'public', 'data', 'shared_trades');
        const unsubTrades = onSnapshot(tradesRef, (snapshot) => {
          const loadedTrades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          loadedTrades.sort((a, b) => b.id.localeCompare(a.id));
          setTrades(loadedTrades);
        }, (error) => {
          console.error("데이터 불러오기 에러:", error);
          setAlertMsg('데이터를 불러오는데 실패했습니다.');
        });

        // 종목 리스트 불러오기 (공유)
        const stocksDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_settings', 'stocks');
        const unsubStocks = onSnapshot(stocksDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const loadedStocks = docSnap.data().list || [];
            setStocks(loadedStocks);
            setFormData(prev => ({ ...prev, stockName: prev.stockName || loadedStocks[0] || '' }));
          } else {
            setFormData(prev => ({ ...prev, stockName: prev.stockName || '스페이스X' }));
          }
        }, (error) => console.error("종목 데이터 불러오기 에러:", error));

        return () => {
          unsubTrades();
          unsubStocks();
        };
      }, [user]);

      // ---------------- 강력한 환율 자동 불러오기 로직 (최대 7일 과거 탐색) ----------------
      const fetchExchangeRate = async (dateStr) => {
        if (!dateStr) return null;
        
        let targetDate = new Date(dateStr);
        const today = new Date();
        
        // 미래 날짜를 선택한 경우 오늘 날짜로 맞춤
        if (targetDate > today) {
          targetDate = today;
        }

        // 주말/공휴일 대응: 선택 날짜부터 과거로 최대 7일까지 환율 데이터가 있는지 거슬러 올라가며 탐색
        for(let i = 0; i < 7; i++) {
          const yyyy = targetDate.getFullYear();
          const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
          const dd = String(targetDate.getDate()).padStart(2, '0');
          const queryStr = `${yyyy}-${mm}-${dd}`;

          try {
            const res = await fetch(`https://api.frankfurter.app/${queryStr}?from=USD&to=KRW`);
            if (res.ok) {
              const data = await res.json();
              return data.rates.KRW.toFixed(2);
            }
          } catch (e) {
            // 통신 에러 발생 시 무시하고 다음 과거 날짜로 진행
          }
          // 하루 전으로 이동
          targetDate.setDate(targetDate.getDate() - 1);
        }
        
        return null;
      };

      useEffect(() => {
        // 초기 실행 시
        if (formData.marketType === 'international') {
          const fetchInitialRate = async () => {
            setIsFetchingRate(true);
            const rate = await fetchExchangeRate(new Date().toISOString().split('T')[0]);
            setFormData(prev => ({ ...prev, exchangeRate: rate || '1350.00' }));
            setIsFetchingRate(false);
          };
          fetchInitialRate();
        }
      }, []);

      const handleChange = async (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));

        // 시장(해외/국내) 변경이나 날짜 변경 시 환율 업데이트
        if (name === 'date' || name === 'marketType') {
          const currentMarket = name === 'marketType' ? value : formData.marketType;
          const currentDate = name === 'date' ? value : formData.date;

          if (currentMarket === 'international' && currentDate) {
            setIsFetchingRate(true);
            const rate = await fetchExchangeRate(currentDate);
            if (rate) {
              setFormData(prev => ({ ...prev, exchangeRate: rate, marketType: currentMarket, date: currentDate }));
            }
            setIsFetchingRate(false);
          } else if (currentMarket === 'domestic') {
            // 국내주식이면 환율 데이터 클리어
            setFormData(prev => ({ ...prev, exchangeRate: '', marketType: currentMarket, date: currentDate }));
          }
        }
      };

      // ---------------- 핸들러 (Firestore 저장 로직, 공유 경로로 저장) ----------------
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!user || !isCloudReady) return;
        
        if (!formData.stockName) {
          setAlertMsg('종목을 선택해주세요.');
          return;
        }

        const tradeId = isEditing ? currentId : Date.now().toString();
        const newTrade = {
          marketType: formData.marketType,
          stockName: formData.stockName,
          date: formData.date,
          buyQty: Number(formData.buyQty),
          buyPrice: Number(formData.buyPrice),
          sellQty: formData.sellQty ? Number(formData.sellQty) : '',
          sellPrice: formData.sellPrice ? Number(formData.sellPrice) : '',
          exchangeRate: formData.marketType === 'international' && formData.exchangeRate ? Number(formData.exchangeRate) : '',
        };

        try {
          // Firestore에 데이터 저장/수정 (공유 경로)
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_trades', tradeId), newTrade);
          
          if (isEditing) {
            setIsEditing(false);
            setCurrentId(null);
          }
          setFormData({ ...formData, buyQty: '', buyPrice: '', sellQty: '', sellPrice: '' });
        } catch (error) {
          setAlertMsg('저장 중 오류가 발생했습니다. (권한 문제일 수 있습니다)');
          console.error(error);
        }
      };

      const handleEdit = async (trade) => {
        if (!stocks.includes(trade.stockName)) {
          const newStocks = [...stocks, trade.stockName];
          if (user && isCloudReady) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_settings', 'stocks'), { list: newStocks });
          }
        }

        // 기존 데이터에 marketType이 없으면 환율 유무로 해외/국내 판별 (하위 호환성)
        const detectedMarket = trade.marketType || (trade.exchangeRate ? 'international' : 'domestic');

        setFormData({
          marketType: detectedMarket,
          stockName: trade.stockName, 
          date: trade.date, 
          buyQty: trade.buyQty, 
          buyPrice: trade.buyPrice,
          sellQty: trade.sellQty || '', 
          sellPrice: trade.sellPrice || '', 
          exchangeRate: trade.exchangeRate || '',
        });
        setIsEditing(true);
        setCurrentId(trade.id);
      };

      const handleDelete = (id) => {
        setConfirmAction(() => async () => {
          if (user && isCloudReady) {
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_trades', id));
            } catch (err) {
              setAlertMsg('삭제 중 오류가 발생했습니다.');
            }
          }
          setConfirmAction(null);
        });
      };

      const handleAddStock = async () => {
        const trimmed = newStockName.trim();
        if (trimmed && !stocks.includes(trimmed)) {
          const newStocks = [...stocks, trimmed];
          setNewStockName('');
          setFormData(prev => ({ ...prev, stockName: trimmed }));
          if (user && isCloudReady) {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_settings', 'stocks'), { list: newStocks });
          }
        }
      };

      const handleDeleteStock = async (stockToDelete) => {
        const newStocks = stocks.filter(s => s !== stockToDelete);
        if (formData.stockName === stockToDelete) {
          setFormData(prev => ({ ...prev, stockName: newStocks.length > 0 ? newStocks[0] : '' }));
        }
        if (user && isCloudReady) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'shared_settings', 'stocks'), { list: newStocks });
        }
      };

      // ---------------- 계산 로직 ----------------
      const calculateMetrics = (trade) => {
        let yieldRate = null;
        let profit = null;
        const isDomestic = trade.marketType === 'domestic' || (!trade.marketType && !trade.exchangeRate);

        if (trade.sellPrice && trade.buyPrice) {
          yieldRate = (trade.sellPrice - trade.buyPrice) / trade.buyPrice;
        }
        if (trade.sellPrice && trade.buyPrice && trade.sellQty) {
          if (isDomestic) {
            // 국내주식: (매도가 - 매수가) * 수량
            profit = (trade.sellPrice - trade.buyPrice) * trade.sellQty;
          } else {
            // 해외주식: (매도가 - 매수가) * 수량 * 환율
            profit = (trade.sellPrice - trade.buyPrice) * trade.sellQty * (trade.exchangeRate || 1);
          }
        }
        return { yieldRate, profit, isDomestic };
      };

      const totalRealizedProfit = useMemo(() => {
        return trades.reduce((sum, trade) => {
          const { profit } = calculateMetrics(trade);
          return sum + (profit || 0);
        }, 0);
      }, [trades]);

      // ---------------- 포맷팅 ----------------
      const formatNumber = (num, decimals = 0) => {
        if (num === null || num === undefined || num === '') return '-';
        return new Intl.NumberFormat('ko-KR', { maximumFractionDigits: decimals, minimumFractionDigits: decimals }).format(num);
      };

      const formatPercent = (num) => {
        if (num === null || num === undefined) return '-';
        return `${(num * 100).toFixed(2)}%`;
      };

      const getColorClass = (value) => {
        if (!value) return 'text-gray-900';
        return value > 0 ? 'text-red-500 font-semibold' : value < 0 ? 'text-blue-500 font-semibold' : 'text-gray-900';
      };

      // 외부 배포 시 DB 정보가 없으면 보여주는 안내 화면
      if (!isCloudReady) {
        return (
          <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-sans">
            <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 max-w-lg text-center space-y-4">
              <div className="mx-auto w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
              </div>
              <h2 className="text-2xl font-bold text-gray-800">클라우드 데이터베이스 설정 필요</h2>
              <p className="text-gray-600 break-keep">
                현재 버전은 여러 기기 간 데이터 동기화를 지원합니다.<br/>
                깃허브 페이지에서 정상 작동하려면, HTML 코드 내의 <code>myFirebaseConfig</code> 변수에 본인의 <strong>Firebase 연결 설정 정보</strong>를 직접 입력해주셔야 합니다.
              </p>
            </div>
          </div>
        );
      }

      if (!authResolved) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-50">
            <div className="animate-pulse text-indigo-600 font-bold text-xl flex items-center gap-2">
              <ActivityIcon /> 앱 환경 설정 중...
            </div>
          </div>
        );
      }

      const isDomesticForm = formData.marketType === 'domestic';

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans relative">
          
          {/* ----- 공통 모달 UI ----- */}
          {alertMsg && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
                <h3 className="text-lg font-medium mb-5 text-gray-800">{alertMsg}</h3>
                <button onClick={() => setAlertMsg('')} className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">확인</button>
              </div>
            </div>
          )}

          {confirmAction && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
                <h3 className="text-lg font-medium mb-5 text-gray-800">이 거래 내역을 삭제하시겠습니까?</h3>
                <div className="flex justify-center gap-3">
                  <button onClick={() => setConfirmAction(null)} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">취소</button>
                  <button onClick={confirmAction} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">삭제</button>
                </div>
              </div>
            </div>
          )}
          
          {/* ----- 종목 관리 모달창 ----- */}
          {isStockModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-md">
                <h3 className="text-xl font-bold mb-1 text-gray-800">종목 데이터베이스 관리</h3>
                <p className="text-sm text-gray-500 mb-4">자주 거래하는 주식 종목을 추가하거나 삭제하세요.</p>
                
                <div className="flex gap-2 mb-4">
                  <input
                    type="text"
                    value={newStockName}
                    onChange={(e) => setNewStockName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleAddStock()}
                    placeholder="새 종목명 입력 (예: 아마존)"
                    className="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  />
                  <button
                    onClick={handleAddStock}
                    className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium whitespace-nowrap"
                  >
                    추가
                  </button>
                </div>
                
                <div className="border border-gray-200 rounded-lg overflow-hidden">
                  <ul className="max-h-60 overflow-y-auto divide-y divide-gray-100 bg-gray-50">
                    {stocks.length === 0 ? (
                      <li className="p-4 text-center text-gray-400 text-sm">등록된 종목이 없습니다.</li>
                    ) : (
                      stocks.map(stock => (
                        <li key={stock} className="flex justify-between items-center px-4 py-3 bg-white hover:bg-gray-50 transition-colors">
                          <span className="font-medium text-gray-700">{stock}</span>
                          <button
                            onClick={() => handleDeleteStock(stock)}
                            className="text-gray-400 hover:text-red-500 p-1 transition-colors"
                            title="삭제"
                          >
                            <Trash2Icon />
                          </button>
                        </li>
                      ))
                    )}
                  </ul>
                </div>
                
                <div className="mt-6 flex justify-end">
                  <button
                    onClick={() => setIsStockModalOpen(false)}
                    className="px-5 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}
          {/* --------------------------- */}

          <div className="max-w-6xl mx-auto space-y-6">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h1 className="text-3xl font-bold text-gray-800 flex items-center gap-2">
                  <ActivityIcon />
                  나의 주식 거래 일지
                </h1>
                <p className="text-gray-500 mt-1">클라우드 동기화 됨 · 매수/매도 내역을 기록하세요.</p>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 min-w-[250px]">
                <div className="p-3 bg-indigo-50 rounded-lg">
                  <DollarSignIcon />
                </div>
                <div>
                  <p className="text-sm text-gray-500 font-medium">총 실현 수익금 (KRW)</p>
                  <p className={`text-2xl font-bold ${totalRealizedProfit >= 0 ? 'text-red-500' : 'text-blue-500'}`}>
                    {totalRealizedProfit >= 0 ? '+' : ''}{formatNumber(totalRealizedProfit)}원
                  </p>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="bg-gray-50 px-6 py-4 border-b border-gray-200">
                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2">
                  {isEditing ? <Edit2Icon /> : <PlusIcon />}
                  {isEditing ? '거래 내역 수정' : '새 거래 추가'}
                </h2>
              </div>
              <form onSubmit={handleSubmit} className="p-6">
                {/* 🌟 국내/해외 주식 선택 라디오 버튼 🌟 */}
                <div className="flex gap-6 mb-5 border-b border-gray-100 pb-5">
                  <label className="flex items-center gap-2 cursor-pointer group">
                    <input 
                      type="radio" 
                      name="marketType" 
                      value="international" 
                      checked={formData.marketType === 'international'} 
                      onChange={handleChange} 
                      className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                    />
                    <span className={`text-sm font-semibold ${formData.marketType === 'international' ? 'text-indigo-600' : 'text-gray-500 group-hover:text-gray-700'}`}>
                      🇺🇸 해외주식
                    </span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer group">
                    <input 
                      type="radio" 
                      name="marketType" 
                      value="domestic" 
                      checked={formData.marketType === 'domestic'} 
                      onChange={handleChange} 
                      className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                    />
                    <span className={`text-sm font-semibold ${formData.marketType === 'domestic' ? 'text-indigo-600' : 'text-gray-500 group-hover:text-gray-700'}`}>
                      🇰🇷 국내주식
                    </span>
                  </label>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="space-y-1">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-medium text-gray-700">종목명</label>
                      <button 
                        type="button" 
                        onClick={() => setIsStockModalOpen(true)} 
                        className="text-xs text-indigo-600 hover:text-indigo-800 flex items-center gap-1 font-medium transition-colors"
                      >
                        <SettingsIcon /> 관리
                      </button>
                    </div>
                    <select 
                      name="stockName" 
                      value={formData.stockName} 
                      onChange={handleChange} 
                      required 
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white appearance-none cursor-pointer"
                    >
                      {stocks.length === 0 && <option value="" disabled>등록된 종목이 없습니다</option>}
                      {stocks.map(stock => (
                        <option key={stock} value={stock}>{stock}</option>
                      ))}
                    </select>
                  </div>
                  
                  <div className="space-y-1"><label className="text-sm font-medium text-gray-700">날짜</label><input type="date" name="date" value={formData.date} onChange={handleChange} required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                  <div className="space-y-1"><label className="text-sm font-medium text-gray-700">매수량</label><input type="number" step="any" name="buyQty" value={formData.buyQty} onChange={handleChange} required className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                  
                  {/* 동적 라벨: 시장에 따라 달러($) 또는 원(원) 표시 */}
                  <div className="space-y-1">
                    <label className="text-sm font-medium text-gray-700">
                      매수가 {isDomesticForm ? '(원)' : '($)'}
                    </label>
                    <input type="number" step="any" name="buyPrice" value={formData.buyPrice} onChange={handleChange} required placeholder={isDomesticForm ? '예: 85000' : '예: 150.5'} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                  </div>
                  <div className="space-y-1"><label className="text-sm font-medium text-gray-700">매도량 <span className="text-gray-400 font-normal">(선택)</span></label><input type="number" step="any" name="sellQty" value={formData.sellQty} onChange={handleChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" /></div>
                  <div className="space-y-1">
                    <label className="text-sm font-medium text-gray-700">
                      매도가 {isDomesticForm ? '(원)' : '($)'} <span className="text-gray-400 font-normal">(선택)</span>
                    </label>
                    <input type="number" step="any" name="sellPrice" value={formData.sellPrice} onChange={handleChange} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                  </div>
                  
                  {/* 해외주식일 때만 환율 입력칸 표시 */}
                  {!isDomesticForm && (
                    <div className="space-y-1">
                      <label className="text-sm font-medium text-gray-700 flex justify-between items-center">
                        <span>적용 환율 (원)</span>
                        {isFetchingRate && <span className="text-xs text-indigo-500 animate-pulse font-normal">탐색 중...</span>}
                      </label>
                      <input type="number" step="any" name="exchangeRate" value={formData.exchangeRate} onChange={handleChange} required={!isDomesticForm} className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-indigo-50" />
                    </div>
                  )}

                  <div className={`flex items-end ${isDomesticForm ? 'lg:col-span-2' : 'lg:col-span-1'}`}>
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">{isEditing ? '수정 완료' : '기록 추가'}</button>
                  </div>
                </div>
              </form>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
              <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2"><TrendingUpIcon /> 거래 내역</h2>
                <span className="text-sm text-gray-500">총 {trades.length}건</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="text-xs text-gray-500 uppercase bg-gray-50">
                    <tr>
                      <th className="px-6 py-4 font-semibold">종목명</th>
                      <th className="px-6 py-4 font-semibold">날짜</th>
                      <th className="px-6 py-4 text-right font-semibold">매수량</th>
                      <th className="px-6 py-4 text-right font-semibold">매수가</th>
                      <th className="px-6 py-4 text-right font-semibold">매도량</th>
                      <th className="px-6 py-4 text-right font-semibold">매도가</th>
                      <th className="px-6 py-4 text-right font-semibold">수익률</th>
                      <th className="px-6 py-4 text-right font-semibold">환율</th>
                      <th className="px-6 py-4 text-right font-semibold">수익금(KRW)</th>
                      <th className="px-6 py-4 text-center font-semibold">관리</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {trades.length === 0 ? (
                      <tr><td colSpan="10" className="px-6 py-12 text-center text-gray-400">클라우드에 저장된 거래 내역이 없습니다.</td></tr>
                    ) : (
                      trades.map((trade) => {
                        const { yieldRate, profit, isDomestic } = calculateMetrics(trade);
                        return (
                          <tr key={trade.id} className="hover:bg-gray-50 transition-colors">
                            <td className="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
                              <span className={`inline-block mr-2 px-2 py-0.5 text-[10px] font-bold rounded-sm ${isDomestic ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>
                                {isDomestic ? '국내' : '해외'}
                              </span>
                              {trade.stockName}
                            </td>
                            <td className="px-6 py-4 text-gray-500">{trade.date}</td>
                            <td className="px-6 py-4 text-right text-gray-700">{formatNumber(trade.buyQty)}</td>
                            <td className="px-6 py-4 text-right text-gray-700">
                              {isDomestic ? `${formatNumber(trade.buyPrice)}원` : `$${formatNumber(trade.buyPrice, 2)}`}
                            </td>
                            <td className="px-6 py-4 text-right text-gray-700">{formatNumber(trade.sellQty) === '-' ? <span className="text-gray-300">보유중</span> : formatNumber(trade.sellQty)}</td>
                            <td className="px-6 py-4 text-right text-gray-700">
                              {trade.sellPrice ? (isDomestic ? `${formatNumber(trade.sellPrice)}원` : `$${formatNumber(trade.sellPrice, 2)}`) : '-'}
                            </td>
                            <td className={`px-6 py-4 text-right ${getColorClass(yieldRate)}`}>{formatPercent(yieldRate)}</td>
                            <td className="px-6 py-4 text-right text-gray-500">
                              {isDomestic ? '-' : formatNumber(trade.exchangeRate, 2)}
                            </td>
                            <td className={`px-6 py-4 text-right font-bold ${getColorClass(profit)}`}>{profit ? `${profit > 0 ? '+' : ''}${formatNumber(profit)}` : '-'}</td>
                            <td className="px-6 py-4 text-center">
                              <div className="flex justify-center gap-3">
                                <button onClick={() => handleEdit(trade)} className="text-gray-400 hover:text-indigo-600 transition-colors" title="수정하기"><Edit2Icon /></button>
                                <button onClick={() => handleDelete(trade.id)} className="text-gray-400 hover:text-red-500 transition-colors" title="삭제하기"><Trash2Icon /></button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StockTracker />);
  </script>
</body>
</html>
